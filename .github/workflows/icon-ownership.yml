name: Generated icon texture ownership
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths: ['OpenDreamRuntime/Resources/**', 'tests/icon_ownership/**', '.github/workflows/icon-ownership.yml']
permissions:
  contents: read
jobs:
  image-owners:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repeated image ownership and deliberate omissions; no game execution
        shell: pwsh
        run: python tests/icon_ownership/run.py --dotnet (Get-Command dotnet).Source --output icon-ownership-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-ownership-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: icon-ownership-output/
          retention-days: 14
